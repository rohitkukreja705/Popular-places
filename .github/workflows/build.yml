name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name bhopal_food_map \
            --org com.bhopalfoodmap /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Add required Android permissions
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]
          block = "".join(f"    {p}\n" for p in permissions) + "\n"

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", block + "    <application", 1)
              with open(path, "w") as f:
                  f.write(content)
              print("Patched AndroidManifest.xml with required permissions")
          else:
              print("Manifest already has required permissions — skipping")
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhopal-food-map-apk
          path: build/app/outputs/flutter-apk/app-release.apk
